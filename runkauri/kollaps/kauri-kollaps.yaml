version: "3.3"
services:
  bootstrapper:
    image: kollaps:2.0
    command: ["-s", "571b3027-12e0-423f-9964-69b407d945d7"]
    deploy:
      mode: global
    environment:
      KOLLAPS_UUID: '571b3027-12e0-423f-9964-69b407d945d7'
      KOLLAPS_ORCHESTRATOR: swarm
      NUMBER_OF_GODS: 2
      POOL_PERIOD: 0.05
      MAX_FLOW_AGE: 2
    labels:
      boot571b3027-12e0-423f-9964-69b407d945d7: "true"
    volumes:
      - '/lib/modules:/lib/modules/'
      - '/usr/src:/usr/src/'
      - '/sys/:/sys/'
      - '/home/tomas/thesis/MSc-Kauri/runkauri/kollaps/topology_inforum2.xml:/topology.xml'
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    networks:
      - KollapsNet

  dashboard-571b3027-12e0-423f-9964-69b407d945d7:
    image: kollaps/dashboard:1.0
    ports:
      - "8088:8088"
    hostname: dashboard
    deploy:
      replicas: 1
    environment:
      KOLLAPS_UUID: '571b3027-12e0-423f-9964-69b407d945d7'
      KOLLAPS_ORCHESTRATOR: swarm
    networks:
      - KollapsNet
      - outside

  server1-571b3027-12e0-423f-9964-69b407d945d7:
    image: kauri
    entrypoint: ["/bin/sh", "-c", "mkfifo /tmp/Kollaps_hang; exec /bin/sh <> /tmp/Kollaps_hang #"]
    command: ['bls','2','1','1','1','50','500','7','1']
    hostname: server1
    labels:
      571b3027-12e0-423f-9964-69b407d945d7: "true"
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
    environment:
      KOLLAPS_UUID: '571b3027-12e0-423f-9964-69b407d945d7'
      KOLLAPS_ORCHESTRATOR: swarm
    networks:
      - KollapsNet

